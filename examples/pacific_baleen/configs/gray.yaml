# Gray whale — eastern North Pacific (v1). Knocks, pulse series, exhalations and bubble blasts excluded
# (GW001-GW004, GW015-GW017, GW021, GW022). Western N Pacific: gap for v2.
class: Gray
sd_inflation: 1.5
individual_sd_ratio: 0.3                 # GWX09 (assumed)
year_range: [2000, 2022]
sampling_order: [context, population]    # equal encounters: southbound, northbound, lagoon, Arctic feeding (GWX01)
drift: {}

# Burnham 2018 low/high = min/max frequency (mapped by direction); peak given.
call_types:
  m3_moan_n:   {model: pulsed_band, f_low: {mean: 19.6, sd: 15.7, range: [10, 60]}, f_high: {mean: 124.6, sd: 33.4}, carrier: {mean: 48.0, sd: 24.6}, sideband_spacing: {mean: 12.95, sd: 7.48, range: [7.5, 49], src: GW013}, carrier_fm: {depth_hz: {uniform: [5, 30]}, note: "slow centre modulation (GW013)"}, duration: {mean: 2.14, sd: 0.8}, src: "GW009, GW013"}
  m3_moan_s:   {model: pulsed_band, f_low: {mean: 16.1, sd: 7.5, range: [10, 40]}, f_high: {mean: 114.3, sd: 31.4}, carrier: {mean: 48.7, sd: 25.3}, sideband_spacing: {mean: 12.95, sd: 7.48, range: [7.5, 49]}, carrier_fm: {depth_hz: {uniform: [5, 30]}}, duration: {mean: 2.52, sd: 1.14}, src: "GW010, GW013"}
  low_moan:    {model: tone, f: {mean: 44.9, sd: 15.6}, f_range: {low: {mean: 32.4, sd: 13.3}, high: {mean: 58.6, sd: 20.5}, note: "narrow moan wanders between low/high"}, duration: {mean: 2.27, sd: 0.94}, src: GW011}
  upsweep_n:   {model: sweep, f_start: {mean: 43.6, sd: 26.6}, f_end: {mean: 179.9, sd: 68.2}, duration: {mean: 1.65, sd: 0.59}, src: GW005}
  upsweep_s:   {model: sweep, f_start: {mean: 33.4, sd: 20.2}, f_end: {mean: 159.1, sd: 26.5}, duration: {mean: 2.78, sd: 1.21}, src: GW006}
  downsweep_n: {model: sweep, f_start: {mean: 123.0, sd: 45.4}, f_end: {mean: 30.8, sd: 17.3}, duration: {mean: 2.21, sd: 0.67}, src: GW007}
  downsweep_s: {model: sweep, f_start: {mean: 116.6, sd: 56.4}, f_end: {mean: 27.0, sd: 27.4, range: [10, 80]}, duration: {mean: 5.09, sd: 1.5}, src: GW008}
  grunt_mig:   {model: pulsed_band, f_low: {mean: 36.3, sd: 25.8}, f_high: {mean: 151.4, sd: 67.7}, carrier: {mean: 66.1, sd: 30.8}, pulse_rate: {uniform: [10, 40], note: "zipper-like (GW014; assumed rate)"}, duration: {mean: 2.37, sd: 0.84}, src: "GW012, GW014"}
  # Lagoon (Dahlheim 1987: values given as median (range))
  s2:          {model: tone, f: {uniform: [250, 300]}, duration: {mean: 0.3, range: [0.2, 0.4]}, src: GW018}
  s3_moan:     {model: modulated, f_start: {mean: 125, range: [80, 200]}, f_end: {mean: 1250, range: [750, 1800]}, f_peak: {uniform: [170, 430], note: "energy band"}, pulsed_onset_s: {uniform: [0.1, 0.4], note: "pulse onset not emitted"}, duration: {mean: 2.0, range: [1.0, 4.0]}, src: GW019}
  s4_grunt:    {model: pulsed_band, f_low: {mean: 150, range: [125, 200]}, f_high: {mean: 1570, range: [1500, 1600]}, carrier: {uniform: [225, 600]}, pulse_rate: {uniform: [20, 60], note: assumed}, duration: {mean: 0.9, range: [0.7, 1.4]}, src: GW020}
  # Arctic feeding (Moore & Ljungblad 1984)
  n3_moan:     {model: modulated, f_low: 102, f_high: 578, f_peak: {mean: 325, cv: 0.2}, shape: {choice: [flat, up, down], note: assumed}, duration: {mean: 0.9, cv: 0.3}, src: GW023}
  n4_grunt:    {model: pulsed_band, f_low: 136, f_high: 748, carrier: {mean: 388, cv: 0.2}, pulse_rate: {uniform: [20, 60], note: assumed}, duration: {mean: 0.3, range: [0.2, 0.5]}, src: GW024}

populations:
  enp_migration:
    region: "E N Pacific migration corridor (California, Vancouver Island)"
    contexts:
      southbound:
        template: migration
        call_mix: {weights: {m3_moan_s: 3619, upsweep_s: 26, downsweep_s: 4, low_moan: 30, note: "98% moans (GWX04); low_moan share assumed"}}
      northbound:
        template: migration
        call_mix: {weights: {m3_moan_n: 11506, low_moan: 172, upsweep_n: 998, downsweep_n: 65, grunt_mig: 19, note: "84% moans; knocks removed (GW001-GW012)"}}
  enp_lagoon:
    region: "Laguna San Ignacio, Mexico (breeding)"
    contexts:
      lagoon:
        group_size: {uniform_int: [5, 30], note: "local subset of ~200-260 whales (assumed)"}
        callers: {uniform_int: [2, 10], src: GWX11}
        call_mix: {weights: {s2: 5, s3_moan: 1, s4_grunt: 5}, src: GWX06}
        sequence: {type: irregular, rate_per_h: {lognormal_median: 9, range: [3, 20], cv_between_encounters: 0.4}, src: "GWX06, GWX07"}
        timeline: {silent_spell_min: {lognormal_median: 10, range: [2, 60], note: assumed}}
        range_km: {loguniform: [0.1, 5], note: "callers at varied ranges (GWX11)"}
        chorus_p: 0
        encounter_len_min: {loguniform: [30, 120]}
  enp_arctic:
    region: "Bering / Chukchi feeding grounds"
    contexts:
      arctic_feeding:
        group_size: {uniform_int: [1, 6], note: assumed}
        callers: {uniform_int: [1, 3]}
        call_mix: {weights: {n3_moan: 0.5, n4_grunt: 0.5, note: assumed}}
        sequence: {type: irregular, rate_per_h: {lognormal_median: 5, range: [1, 30]}, src: "GWX08 (assumed)"}
        timeline: {silent_spell_min: {lognormal_median: 30, range: [5, 180], note: assumed}}
        range_km: {loguniform: [0.2, 10]}
        detectability_bias: low           # received levels near ambient (GWX08)
        chorus_p: 0
        encounter_len_min: {loguniform: [30, 180]}

context_templates:
  migration:
    group_size: {choice: [1, 2, 3, 4, 5, 6, 7], weights: [0.45, 0.27, 0.18, 0.04, 0.03, 0.02, 0.01], src: GWX05}
    vocal_p: 0.33                          # GWX03
    callers_cap: 2                         # 1 focal caller p 0.8 (GWX02)
    sequence:
      type: spells
      calls_per_spell: {uniform_int: [5, 32], src: GWX02}
      ici_min: {mean: 3.9, sd: 2.3, min: 0.3, src: GWX02}
    timeline:
      silent_spell_h: {lognormal_median: 1, range: [0.2, 6], src: GWX03}
      night: {p: 0.5, rate_multiplier: 2, src: GWX04}
      deep_water: {p: 0.3, silence_multiplier: 2, src: GWX03}
    range_trajectory: {type: pass_by, speed_ms: {mean: 1.6, sd: 0.59}, closest_km: {loguniform: [0.2, 3.4]}, src: "GWX05, GWX10"}
    chorus_p: 0
    encounter_len_min: {loguniform: [30, 120]}

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e "python[dev,pamguard]"
      - run: pytest -q python/tests

  delphinid:
    name: delphinID (TensorFlow) + notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "python[dev,delphinid,notebooks]"
      - run: pytest -q python/tests/test_delphinid_model.py python/tests/test_delphinid_crossval.py python/tests/test_delphinid_export.py
      - name: Run notebooks on the example data
        run: python tools/run_notebooks.py

  r:
    name: R package + Quarto notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/speciesClassifiers
          extra-packages: any::testthat, any::knitr, any::rmarkdown
      - name: Install and test the package
        run: |
          R CMD INSTALL R/speciesClassifiers
          Rscript -e 'testthat::test_dir("R/speciesClassifiers/tests/testthat", package = "speciesClassifiers", load_package = "installed", stop_on_failure = TRUE)'
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render notebooks on the example data
        working-directory: notebooks/R
        run: |
          quarto render 03_randomforest.qmd
          quarto render 04_transferlearning.qmd
